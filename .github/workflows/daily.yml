name: AI 日报

on:
  # GitHub 自带的定时器已取消：它每天只在这个仓库的两个窗口批量执行
  # （北京 06:1x-06:5x / 14:5x），延迟 4.5~7.3 小时且不稳定，定不到早上 8 点。
  # 需要自动出刊时，用外部定时器调 workflow_dispatch 接口（或直接在这里手动 Run）。
  workflow_dispatch: {}   # 手动触发：Actions 页面「Run workflow」/ 外部定时器调 API
  push:
    branches: [main]      # 当天还没出刊时，任何一次代码提交也会顺手补发

permissions:
  contents: write   # 把详情页提交回仓库留档
  pages: write      # 部署到 GitHub Pages
  id-token: write

concurrency:
  group: ai-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成并发送
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f "docs/$DAY/index.html" ]; then
            echo "今天（$DAY）已经出刊，跳过这次自动运行，避免一天发两封"
            exit 0
          fi
          python main.py

      - name: 详情页留档
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "没有新的详情页"
          else
            git commit -m "chore: 发布 $(date -u -d '+8 hour' +%F) 日报详情页"
            git push
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 存档本期 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-${{ github.run_number }}
          path: output/
          retention-days: 14

  deploy:
    needs: daily
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
