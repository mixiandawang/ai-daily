name: AI 日报

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00（GitHub 定时任务可能延迟几分钟到十几分钟）
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发一次，方便测试

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成并发送
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: 存档本期 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-${{ github.run_number }}
          path: output/
          retention-days: 14
