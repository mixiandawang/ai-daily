name: AI 日报

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00（GitHub 定时任务可能延迟几分钟到十几分钟）
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发一次，方便测试

permissions:
  contents: write   # 需要把详情页提交回仓库，供 GitHub Pages 托管

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成并发送
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: 发布详情页
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "没有新的详情页"
          else
            git commit -m "chore: 发布 $(date -u -d '+8 hour' +%F) 日报详情页"
            git push
          fi

      - name: 存档本期 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-${{ github.run_number }}
          path: output/
          retention-days: 14
