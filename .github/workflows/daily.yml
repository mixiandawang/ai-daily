name: AI 日报

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00（GitHub 定时任务可能延迟几分钟到十几分钟）
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发一次，方便测试

permissions:
  contents: write   # 把详情页提交回仓库留档
  pages: write      # 部署到 GitHub Pages
  id-token: write

concurrency:
  group: ai-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成并发送
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: 详情页留档
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "没有新的详情页"
          else
            git commit -m "chore: 发布 $(date -u -d '+8 hour' +%F) 日报详情页"
            git push
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 存档本期 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-${{ github.run_number }}
          path: output/
          retention-days: 14

  deploy:
    needs: daily
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
